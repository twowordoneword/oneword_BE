name: Deploy

# main에 푸시된 커밋 중 CI가 통과한 것만 배포한다.
# 수동 배포(workflow_dispatch)는 선택한 브랜치의 최신 커밋을 올린다 — 롤백은 docs/DEPLOY.md 참고.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

# 배포가 겹치면 뒤에 온 것만 남긴다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Settings → Environments → production 에 시크릿을 두고, 필요하면 승인자를 지정한다.
    environment: production
    permissions:
      contents: read
      packages: write

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REMOTE_DIR: musing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Image name
        # GHCR 이미지 이름은 소문자만 허용된다.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/nginx
          target: ${{ env.REMOTE_DIR }}
          strip_components: 1

      - name: Roll out
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,REMOTE_DIR
          script: |
            set -eu
            cd "$HOME/$REMOTE_DIR"
            test -f .env || { echo ".env가 없습니다 — docs/DEPLOY.md 1회 준비 참고"; exit 1; }

            COMPOSE="docker compose -f docker-compose.prod.yml"
            PREV_IMAGE=$(cat .deployed-image 2>/dev/null || true)

            # 기동 확인: 보호 API가 401이면 앱이 요청을 받고 있다(헬스체크 엔드포인트는 #9에서 추가 예정).
            # 운영 설정이 잘못되면 ProductionConfigGuard가 기동을 막으므로 여기서 실패한다.
            wait_ready() {
              for _ in $(seq 1 45); do
                code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/me || true)
                [ "$code" = "401" ] && return 0
                sleep 2
              done
              echo "앱이 90초 안에 응답하지 않았습니다 (마지막 응답: $code)"
              return 1
            }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT
            export APP_IMAGE
            $COMPOSE pull app
            $COMPOSE up -d --remove-orphans

            if wait_ready; then
              echo "$APP_IMAGE" > .deployed-image
              echo "배포 완료: $APP_IMAGE"
              # 일주일 넘게 안 쓴 이미지만 정리한다(직전 이미지는 롤백용으로 남긴다).
              docker image prune -af --filter "until=168h" > /dev/null
              exit 0
            fi

            $COMPOSE logs --tail 100 app
            if [ -n "$PREV_IMAGE" ]; then
              echo "직전 이미지로 되돌립니다: $PREV_IMAGE"
              APP_IMAGE="$PREV_IMAGE" $COMPOSE up -d
              wait_ready && echo "롤백 완료" || echo "롤백 후에도 응답 없음 — 수동 확인 필요"
            fi
            exit 1
