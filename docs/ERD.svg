<text class="note" x="570" y="227">   Essentia 자체분석)</text>
<text class="ex"  x="582" y="253">ex) 12 · 밤편지 · 아이유</text>

<rect class="box hdr" x="300" y="425" width="180" height="26" rx="6"/>
<rect class="box" x="300" y="451" width="180" height="86"/>
<text class="tbl-title" x="312" y="443">DIARY_TRACKS</text>
<text class="pk"  x="312" y="471">id (PK)</text>
<text class="col" x="312" y="489">diary_id (FK)</text>
<text class="col" x="312" y="505">track_id (FK)</text>
<text class="col" x="312" y="521">role  ·MY / RECOMMENDED</text>
