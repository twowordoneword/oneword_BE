spring:
  datasource:
    # 계정은 환경변수로 주입(없으면 로컬 기본값). 배포 시 실제 값은 env로만 전달 — 커밋 금지.
    url: ${DB_URL:jdbc:mysql://localhost:3306/musing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:musing}
    password: ${DB_PASSWORD:musing}
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    # 시드 사용자(provider=local)는 소셜 로그인 도입으로 접근 경로가 사라져 제거했다.
    # 스키마는 Flyway가 전담한다.
    init:
      mode: never

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  auth:
    # 소셜 값이 비어 있으면 그 제공자만 비활성(로그인 시 UNSUPPORTED_PROVIDER)이고 서버는 정상 기동한다.
    jwt-secret: ${APP_JWT_SECRET:local-dev-jwt-secret-change-this-at-least-32-bytes}
    access-token-seconds: ${APP_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${APP_REFRESH_TOKEN_SECONDS:1209600}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    apple-client-id: ${APPLE_CLIENT_ID:}
    kakao-client-id: ${KAKAO_CLIENT_ID:}
    naver-client-id: ${NAVER_CLIENT_ID:}
    naver-client-secret: ${NAVER_CLIENT_SECRET:}

musing:
  track-search:
    cache:
      ttl-seconds: 30
    rate-limit:
      max-requests: 30
      window-seconds: 60
    external:
      bulkhead:
        max-concurrent: 20
      retry:
        backoff-ms: 120
      circuit:
        failure-threshold: 5
        open-seconds: 30
