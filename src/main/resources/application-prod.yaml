spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: false
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
  auth:
    jwt-secret: ${APP_JWT_SECRET}
    access-token-seconds: ${APP_ACCESS_TOKEN_SECONDS}
    refresh-token-seconds: ${APP_REFRESH_TOKEN_SECONDS}
    google-client-id: ${GOOGLE_CLIENT_ID}
    apple-client-id: ${APPLE_CLIENT_ID}
    kakao-client-id: ${KAKAO_CLIENT_ID}
    naver-client-id: ${NAVER_CLIENT_ID}
    naver-client-secret: ${NAVER_CLIENT_SECRET}
