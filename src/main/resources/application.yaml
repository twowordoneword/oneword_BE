spring:
  application:
    name: musing_BE
  datasource:
    # 계정은 환경변수로 주입(없으면 로컬 기본값). 배포 시 실제 값은 env로만 전달 — 커밋 금지.
    url: ${DB_URL:jdbc:mysql://localhost:3306/musing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:musing}
    password: ${DB_PASSWORD:musing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # 로컬 update. ⚠️ 배포 시 validate(+schema.sql)로 변경
    defer-datasource-initialization: true   # data.sql 시드가 스키마 생성 뒤 실행되도록
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always            # data.sql 실행(개발 시드)

server:
  port: 8080
  servlet:
    context-path: /

# ----- 뮤징 추천/수집 설정 (RECOMMENDATION_STAGE2 §7) -----
musing:
  chart:
    enabled: false            # 자동 실행 스위치. 설문 수집을 먼저 하므로 꺼 둠(수동 트리거는 가능)
    storefronts: kr,us        # 후보 풀 수집 대상. kr만 쓰려면 'kr'
    limit: 100                # Apple RSS 상한(200은 빈 응답)
    songs-per-artist: 50      # 아티스트당 카탈로그 곡 수 — 풀 크기·소요 시간 조절
    request-delay-ms: 3000    # iTunes 분당 20콜 제한 대응
    cron: "0 0 3 * * MON"     # 매주 월요일 03:00 (Asia/Seoul)
  freqblog:
    # 키는 커밋 금지 — 환경변수로만 주입.  FREQBLOG_API_KEY=sk_live_... ./gradlew bootRun
    api-key: ${FREQBLOG_API_KEY:}
    max-per-run: 200          # 실행당 조회 상한(무료 월 1,000건 보호)
    request-delay-ms: 200     # 동시 6건 제한이 있어 순차 호출
  recommendation:
    # --- 감정 좌표 보정 (§5.5) ---
    # 기분 좌표는 0~1 전체를 쓰지만 실제 분석값은 좁은 구간에 몰린다.
    # 목표 좌표를 이 구간으로 옮겨 8개 기분이 서로 구분되게 한다.
    # 실측(2026-08-07, 곡 371개): valence 0.25~0.71 / energy 0.06~1.00
    # 곡이 크게 늘면 MIN/MAX를 다시 재서 갱신할 것.
    calibrate: true
    valence-min: 0.25
    valence-max: 0.71
    arousal-min: 0.06
    arousal-max: 1.00
    # --- 곡 선택 점수 (§5.1) — 모두 검증 전 시작값 ---
    weight-valence: 1.0         # 밝기 거리 가중
    weight-arousal: 1.0         # 활기 거리 가중
    weight-acoustic-rain: 0.5   # 비 오는 날 어쿠스틱 가중
    bonus-same-artist: 0.15     # seed와 같은 가수 우대
    bonus-same-genre: 0.05      # seed와 같은 장르 우대
    match-seed-language: true   # seed가 한국 곡이면 한국 곡만, 해외 곡이면 해외 곡만 후보로
    bonus-korean: 0.03          # 한국 곡 우대(동점 처리용). 0.12는 감정 매칭을 압도해 낮춤
    top-k: 30                   # 상위 30곡 중 고정 시드로 선택(다양성)
    exclude-recent-days: 14     # 최근 추천 곡 제외 기간
  admin:
    # 배치 수동 트리거용 공유 토큰. 비어 있으면 트리거가 항상 401.
    token: ${ADMIN_TOKEN:}
