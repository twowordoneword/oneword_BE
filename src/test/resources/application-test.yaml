spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/musing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:musing}
    password: ${DB_PASSWORD:musing}
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors:
    allowed-origin-patterns: http://localhost:*
  auth:
    jwt-secret: ${APP_JWT_SECRET:test-jwt-secret-at-least-32-bytes}
    access-token-seconds: ${APP_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${APP_REFRESH_TOKEN_SECONDS:1209600}
    google-client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
    apple-client-id: ${APPLE_CLIENT_ID:test-apple-client-id}
    kakao-client-id: ${KAKAO_CLIENT_ID:test-kakao-client-id}
    naver-client-id: ${NAVER_CLIENT_ID:test-naver-client-id}
    naver-client-secret: ${NAVER_CLIENT_SECRET:test-naver-client-secret}

musing:
  track-search:
    cache:
      ttl-seconds: 60
    rate-limit:
      max-requests: 100
      window-seconds: 60
    external:
      bulkhead:
        max-concurrent: 20
      retry:
        backoff-ms: 20
      circuit:
        failure-threshold: 3
        open-seconds: 5
